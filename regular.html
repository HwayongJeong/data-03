<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정기모임 | 숲으로 캠핑클럽</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
@import url("https://fonts.googleapis.com/css2?family=Jua&display=swap");

:root{
  --sky: #6EC6E8;
  --sky-deep: #1F7DA3;
  --sky-pale: #E4F5FB;
  --leaf: #9AD46B;
  --leaf-deep: #4F8A34;
  --leaf-pale: #EEF9E4;
  --forest: #1E3626;
  --ink: #223026;
  --ink-soft: #58685C;
  --paper: #F6FBF4;
  --card: #FFFFFF;
  --line: #DCEBDD;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(30, 54, 38, 0.10);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: "Pretendard", "Noto Sans KR", sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
}
h1,h2,h3, .brand, .btn-hero{
  font-family: "Jua", "Pretendard", sans-serif;
  font-weight: 400;
  letter-spacing: -0.01em;
}
a{ color: inherit; text-decoration: none; }
img{ max-width:100%; display:block; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family: inherit; cursor:pointer; }

.container{ max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* ---------- Header ---------- */
.site-header{
  position: sticky; top:0; z-index: 50;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.site-header .container{
  display:flex; align-items:center; justify-content:space-between;
  height: 68px;
}
.brand{ font-size: 22px; color: var(--forest); display:flex; align-items:center; gap:8px; }
.brand .tag{ font-family:"Pretendard"; font-size: 12px; color: var(--sky-deep); background: var(--sky-pale); padding: 3px 8px; border-radius: 999px; margin-left:4px; }
.nav{ display:flex; gap: 6px; }
.nav a{
  padding: 9px 14px; border-radius: 999px; font-size: 15px; color: var(--ink-soft);
  transition: background .15s, color .15s;
}
.nav a:hover{ background: var(--leaf-pale); color: var(--leaf-deep); }
.nav a.active{ background: var(--forest); color: #fff; }
.nav-toggle{ display:none; background:none; border:none; font-size:24px; color: var(--forest); }

@media (max-width: 760px){
  .nav{ position:fixed; top:68px; left:0; right:0; background:#fff; flex-direction:column; padding:10px 18px 18px; border-bottom:1px solid var(--line); display:none; }
  .nav.open{ display:flex; }
  .nav a{ padding:12px 10px; }
  .nav-toggle{ display:block; }
}

/* ---------- Hero ---------- */
.hero{
  position: relative;
  min-height: 66vh;
  display:flex; align-items:center;
  background:
    linear-gradient(180deg, rgba(15,35,24,.55), rgba(15,35,24,.72)),
    url("https://images.unsplash.com/photo-1476231682828-37e571bc172f?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  color: #fff;
  overflow: hidden;
}
.hero .container{ position: relative; z-index: 2; padding-top: 40px; padding-bottom: 70px; }
.hero-emojis{ font-size: 30px; letter-spacing: 12px; margin-bottom: 18px; opacity:.95; }
.hero h1{ font-size: clamp(32px, 5vw, 52px); margin: 0 0 14px; line-height:1.3; color:#fff; }
.hero p{ font-size: 17px; max-width: 520px; color: #EAF6EC; margin: 0 0 28px; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
.hero-stats{
  display:flex; gap: 30px; margin-top: 46px; flex-wrap:wrap;
}
.hero-stats div{ min-width: 120px; }
.hero-stats b{ display:block; font-size: 26px; font-family:"Jua"; color: var(--leaf); }
.hero-stats span{ font-size: 13px; color: #D9EBDC; }

.canopy{
  position:absolute; left:0; right:0; bottom:-1px; height: 46px; z-index:2;
  background: var(--paper);
  clip-path: polygon(0% 100%, 0% 40%, 3% 15%, 6% 45%, 9% 5%, 12% 40%, 15% 20%, 18% 48%, 22% 10%, 25% 42%, 28% 25%, 31% 46%, 35% 8%, 38% 40%, 41% 22%, 44% 48%, 48% 12%, 51% 44%, 54% 24%, 57% 46%, 61% 6%, 64% 40%, 67% 20%, 70% 48%, 74% 14%, 77% 44%, 80% 24%, 83% 46%, 87% 8%, 90% 40%, 93% 22%, 96% 48%, 100% 15%, 100% 100%);
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 11px 20px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--leaf); color: var(--forest); }
.btn-primary:hover{ box-shadow: 0 6px 16px rgba(79,138,52,.35); }
.btn-outline{ background: rgba(255,255,255,.12); color:#fff; border: 1px solid rgba(255,255,255,.6); }
.btn-outline:hover{ background: rgba(255,255,255,.22); }
.btn-sky{ background: var(--sky); color:#0B3A4A; }
.btn-sky:hover{ box-shadow: 0 6px 16px rgba(31,125,163,.30); }
.btn-ghost{ background: var(--leaf-pale); color: var(--leaf-deep); }
.btn-danger{ background: #FDEAEA; color: #B23A3A; }
.btn-sm{ padding: 7px 14px; font-size: 13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---------- Section ---------- */
.section{ padding: 64px 0; }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 30px; gap:16px; flex-wrap:wrap; }
.section-head h2{ font-size: 28px; color: var(--forest); margin: 0 0 6px; }
.section-head p{ color: var(--ink-soft); margin:0; font-size: 14px; }
.eyebrow{ color: var(--sky-deep); font-size: 13px; margin: 0 0 6px; }

.grid{ display:grid; gap: 20px; }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 860px){ .grid-3{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 620px){ .grid-3, .grid-2{ grid-template-columns: 1fr; } }

.card{
  background: var(--card); border-radius: var(--radius); padding: 22px;
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.card h3{ margin: 0 0 8px; font-size: 19px; color: var(--forest); }
.card .meta{ font-size: 13px; color: var(--sky-deep); margin-bottom: 10px; }
.badge{ display:inline-block; font-size:12px; background: var(--sky-pale); color: var(--sky-deep); padding: 3px 10px; border-radius:999px; margin-right:6px;}
.badge.leaf{ background: var(--leaf-pale); color: var(--leaf-deep); }

/* ---------- Page header (inner pages) ---------- */
.page-head{
  background: linear-gradient(120deg, var(--forest), #2A4B37);
  color:#fff; padding: 52px 0 40px;
}
.page-head h1{ margin:0 0 8px; font-size: 30px; }
.page-head p{ margin:0; color:#D9EBDC; font-size:14px; }

/* ---------- Board table / list ---------- */
.board-toolbar{ display:flex; justify-content:space-between; align-items:center; margin: 26px 0 14px; gap: 12px; flex-wrap:wrap; }
.search{ display:flex; gap:8px; }
.search input{ padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); min-width: 220px; }

.list{ border-top: 2px solid var(--forest); }
.list-row{
  display:flex; align-items:center; gap: 14px; padding: 16px 6px; border-bottom: 1px solid var(--line);
  cursor:pointer;
}
.list-row:hover{ background: var(--leaf-pale); }
.list-row .num{ width: 34px; color: var(--ink-soft); font-size:13px; text-align:center; }
.list-row .title{ flex:1; font-weight:600; }
.list-row .author{ width: 90px; color: var(--ink-soft); font-size: 13px; }
.list-row .date{ width: 100px; color: var(--ink-soft); font-size: 13px; text-align:right; }
.empty{ text-align:center; padding: 50px 10px; color: var(--ink-soft); }

/* ---------- Form ---------- */
.form-card{ background:var(--card); border:1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size: 13px; font-weight:600; color: var(--forest); margin-bottom: 6px; }
.field input, .field textarea, .field select{
  width:100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  font-family: inherit; font-size: 15px; background: #FBFEFA;
}
.field textarea{ min-height: 140px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus{ outline: 2px solid var(--leaf); border-color: transparent; }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width:620px){ .field-row{ grid-template-columns: 1fr; } }
.form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top: 20px; }

/* ---------- Detail view ---------- */
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.detail-head h2{ margin:0 0 8px; font-size:24px; color:var(--forest); }
.detail-body{ min-height: 120px; white-space: pre-wrap; margin-bottom: 26px; }
.detail-actions{ display:flex; gap:10px; }

/* ---------- Modal ---------- */
.modal-backdrop{
  position: fixed; inset:0; background: rgba(20,32,24,.45); display:none;
  align-items:center; justify-content:center; z-index: 100; padding: 20px;
}
.modal-backdrop.open{ display:flex; }
.modal{
  background:#fff; border-radius: var(--radius); padding: 26px; max-width: 480px; width:100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.modal h3{ margin:0 0 6px; color: var(--forest); }
.modal p.sub{ margin:0 0 18px; font-size:13px; color: var(--ink-soft); }

/* ---------- Meetup card ---------- */
.meetup-card{ background:var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:22px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:10px; }
.meetup-card .date-chip{ align-self:flex-start; background: var(--forest); color:#fff; font-size:12px; padding:4px 10px; border-radius:999px; }
.meetup-card .cap{ font-size:13px; color: var(--ink-soft); }
.progress{ height:6px; background: var(--leaf-pale); border-radius:999px; overflow:hidden; }
.progress > div{ height:100%; background: var(--leaf); }

.apply-list{ margin-top: 10px; }
.apply-row{ display:flex; justify-content:space-between; align-items:center; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.apply-row .who{ font-weight:600; }
.apply-row .sub{ color: var(--ink-soft); }

/* ---------- Gallery ---------- */
.gallery-item{ border-radius: var(--radius); overflow:hidden; background:var(--card); border:1px solid var(--line); box-shadow: var(--shadow); }
.gallery-item img{ height: 190px; width:100%; object-fit:cover; }
.gallery-item .pad{ padding: 14px 16px; }

/* ---------- Footer ---------- */
.site-footer{ background: var(--forest); color: #CFE6D3; padding: 44px 0 30px; margin-top: 60px; }
.site-footer .container{ display:flex; justify-content:space-between; flex-wrap:wrap; gap: 20px; }
.site-footer .brand{ color:#fff; }
.site-footer small{ display:block; margin-top:6px; color:#9FC2A6; }
.foot-links{ display:flex; gap:16px; }
.foot-links a:hover{ color: var(--leaf); }

.toast{
  position: fixed; bottom: 26px; left:50%; transform: translateX(-50%);
  background: var(--forest); color:#fff; padding: 12px 22px; border-radius: 999px;
  font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.25); z-index: 200;
  opacity:0; pointer-events:none; transition: opacity .2s, transform .2s;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }

.loading{ text-align:center; padding: 40px; color: var(--ink-soft); }

</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">🌲 숲으로 <span class="tag">Camping Club</span></a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="notice.html">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html" class="active">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </nav>
    <button class="nav-toggle" aria-label="메뉴">☰</button>
  </div>
</header>

<div class="page-head">
  <div class="container">
    <h1>🏕️ 정기모임</h1>
    <p>봄·여름·가을·겨울, 연 4회 전국 회원이 함께 모이는 정기모임입니다.</p>
  </div>
</div>

<div class="container">

  <!-- 목록 화면 -->
  <section id="view-list">
    <div class="board-toolbar">
      <p style="color:var(--ink-soft); font-size:14px; margin:0;">총 <b id="count">0</b>개의 정기모임 일정</p>
      <button class="btn btn-primary" id="btnNewMeetup">＋ 모임 일정 추가</button>
    </div>
    <div id="list" class="grid grid-3">
      <div class="loading">불러오는 중...</div>
    </div>
  </section>

  <!-- 모임 상세 + 신청 -->
  <section id="view-detail" style="display:none;">
    <button class="btn btn-ghost btn-sm" id="btnBack" style="margin-bottom:18px;">← 목록으로</button>
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <span class="badge">정기모임</span>
        <span class="badge leaf" id="d-region"></span>
        <h2 id="d-title" style="margin-top:12px;"></h2>
        <p class="meta" id="d-date"></p>
        <p id="d-desc" style="color:var(--ink-soft);"></p>
        <div class="cap" id="d-cap" style="margin-top:14px;"></div>
        <div class="progress" style="margin-top:6px;"><div id="d-progress" style="width:0%;"></div></div>
        <div class="detail-actions" style="margin-top:18px;">
          <button class="btn btn-primary" id="btnApply">✏️ 참가 신청</button>
          <button class="btn btn-ghost btn-sm" id="btnEditMeetup">일정 수정</button>
          <button class="btn btn-danger btn-sm" id="btnDeleteMeetup">일정 삭제</button>
        </div>
      </div>
      <div class="card">
        <h3>신청자 명단</h3>
        <div id="applyList" class="apply-list"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>
  </section>

  <!-- 모임 작성/수정 폼 -->
  <section id="view-meetup-form" style="display:none;" class="section" style="padding-top:0;">
    <div class="form-card">
      <h3 id="mform-title">모임 일정 추가</h3>
      <input type="hidden" id="mf-id" />
      <div class="field"><label>모임명</label><input type="text" id="mf-title" placeholder="예: 봄맞이 전국 정기모임" /></div>
      <div class="field-row">
        <div class="field"><label>지역</label><input type="text" id="mf-region" placeholder="예: 전국" /></div>
        <div class="field"><label>날짜</label><input type="date" id="mf-date" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>장소</label><input type="text" id="mf-location" placeholder="예: 경기도 가평 자라섬 캠핑장" /></div>
        <div class="field"><label>정원</label><input type="number" id="mf-capacity" placeholder="60" min="1" /></div>
      </div>
      <div class="field"><label>소개</label><textarea id="mf-desc" placeholder="모임 소개를 입력하세요"></textarea></div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="btnCancelMeetup">취소</button>
        <button class="btn btn-primary" id="btnSaveMeetup">저장</button>
      </div>
    </div>
  </section>

</div>

<!-- 신청 모달 -->
<div class="modal-backdrop" id="applyModal">
  <div class="modal">
    <h3 id="applyModalTitle">참가 신청</h3>
    <p class="sub">모임 참가를 신청하시면 신청자 명단에 등록됩니다.</p>
    <input type="hidden" id="a-id" />
    <div class="field"><label>이름</label><input type="text" id="a-name" placeholder="홍길동" /></div>
    <div class="field"><label>연락처</label><input type="text" id="a-phone" placeholder="010-0000-0000" /></div>
    <div class="field"><label>참가 인원</label><input type="number" id="a-people" value="1" min="1" /></div>
    <div class="field"><label>남기실 말씀</label><textarea id="a-message" placeholder="궁금한 점이나 하고 싶은 말을 남겨주세요"></textarea></div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="btnCancelApply">취소</button>
      <button class="btn btn-primary" id="btnSubmitApply">신청하기</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3 id="deleteModalTitle">삭제할까요?</h3>
    <p class="sub">삭제한 내용은 되돌릴 수 없습니다.</p>
    <div class="form-actions">
      <button class="btn btn-ghost" id="btnCancelDelete">취소</button>
      <button class="btn btn-danger" id="btnConfirmDelete">삭제</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="brand">🌲 숲으로 캠핑클럽</div>
      <small>연 4회 정기모임 · 매달 지역별 소모임 · 함께 떠나는 캠핑</small>
    </div>
    <div class="foot-links">
      <a href="notice.html">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </div>
  </div>
</footer>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://njiwzlmdtiyensuvqsqa.supabase.co";
const SUPABASE_KEY = "sb_publishable_sz88_3yW6ETu_00gL-MjdA_9UcO-DYf";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// 테이블 접두어: camp_
const TABLES = {
  notices: "camp_notices",
  posts: "camp_posts",
  regularMeetups: "camp_regular_meetups",
  regularApplications: "camp_regular_applications",
  smallMeetups: "camp_small_meetups",
  smallApplications: "camp_small_applications",
  gallery: "camp_gallery",
};

function formatDate(iso) {
  const d = new Date(iso);
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}.${mm}.${dd}`;
}

function formatDateFull(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

let toastTimer;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function initNavToggle() {
  const btn = document.querySelector(".nav-toggle");
  const nav = document.querySelector(".nav");
  if (btn && nav) {
    btn.addEventListener("click", () => nav.classList.toggle("open"));
  }
}

initNavToggle();

const MEETUP_TABLE = TABLES.regularMeetups;
const APPLY_TABLE = TABLES.regularApplications;
let currentMeetup = null;
let deleteAction = null; // { type: 'meetup'|'apply', id }

const views = {
  list: document.getElementById("view-list"),
  detail: document.getElementById("view-detail"),
  meetupForm: document.getElementById("view-meetup-form"),
};
function showView(name) {
  Object.entries(views).forEach(([k, el]) => el.style.display = (k === name ? "" : "none"));
}

async function loadList() {
  const el = document.getElementById("list");
  el.innerHTML = `<div class="loading">불러오는 중...</div>`;
  const { data: meetups, error } = await supabase.from(MEETUP_TABLE).select("*").order("meetup_date", { ascending: true });
  if (error) { el.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(error.message)}</div>`; return; }
  document.getElementById("count").textContent = meetups.length;
  if (!meetups.length) { el.innerHTML = `<div class="empty">등록된 정기모임 일정이 없습니다.</div>`; return; }

  const cards = await Promise.all(meetups.map(async (m) => {
    const { count } = await supabase.from(APPLY_TABLE).select("*", { count: "exact", head: true }).eq("meetup_id", m.id);
    const applied = count || 0;
    const pct = Math.min(100, Math.round((applied / m.capacity) * 100));
    return `
      <div class="meetup-card" data-id="${m.id}" style="cursor:pointer;">
        <span class="date-chip">${m.meetup_date}</span>
        <h3 style="margin:4px 0 0;">${escapeHtml(m.title)}</h3>
        <p class="meta">${escapeHtml(m.region)} · ${escapeHtml(m.location || "")}</p>
        <div class="cap">신청 ${applied} / ${m.capacity}명</div>
        <div class="progress"><div style="width:${pct}%;"></div></div>
      </div>`;
  }));
  el.innerHTML = cards.join("");
  el.querySelectorAll(".meetup-card").forEach(card => {
    card.addEventListener("click", () => openDetail(Number(card.dataset.id)));
  });
}

async function openDetail(id) {
  const { data: m, error } = await supabase.from(MEETUP_TABLE).select("*").eq("id", id).single();
  if (error || !m) { toast("모임을 찾을 수 없습니다."); return; }
  currentMeetup = m;
  document.getElementById("d-region").textContent = m.region;
  document.getElementById("d-title").textContent = m.title;
  document.getElementById("d-date").textContent = `📅 ${m.meetup_date}  ·  📍 ${m.location || "-"}`;
  document.getElementById("d-desc").textContent = m.description || "";
  showView("detail");
  await loadApplications(m.id, m.capacity);
}

async function loadApplications(meetupId, capacity) {
  const el = document.getElementById("applyList");
  el.innerHTML = `<div class="loading">불러오는 중...</div>`;
  const { data, error } = await supabase.from(APPLY_TABLE).select("*").eq("meetup_id", meetupId).order("created_at", { ascending: true });
  if (error) { el.innerHTML = `<div class="empty">불러오기 실패</div>`; return; }
  const totalPeople = (data || []).reduce((s, a) => s + (a.people_count || 1), 0);
  document.getElementById("d-cap").textContent = `신청 ${data.length}건 · 총 ${totalPeople}명 / 정원 ${capacity}명`;
  document.getElementById("d-progress").style.width = Math.min(100, Math.round((totalPeople / capacity) * 100)) + "%";
  if (!data.length) { el.innerHTML = `<div class="empty">아직 신청자가 없습니다. 첫 신청자가 되어보세요!</div>`; return; }
  el.innerHTML = data.map(a => `
    <div class="apply-row" data-id="${a.id}">
      <div>
        <div class="who">${escapeHtml(a.applicant_name)} 외 ${a.people_count - 1 > 0 ? (a.people_count - 1) + '명' : ''}</div>
        <div class="sub">${escapeHtml(a.phone)}${a.message ? " · " + escapeHtml(a.message) : ""}</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost btn-sm" data-edit="${a.id}">수정</button>
        <button class="btn btn-danger btn-sm" data-del="${a.id}">취소</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openApplyModal(data.find(a => a.id === Number(b.dataset.edit)))));
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    deleteAction = { type: "apply", id: Number(b.dataset.del) };
    document.getElementById("deleteModalTitle").textContent = "신청을 취소할까요?";
    document.getElementById("deleteModal").classList.add("open");
  }));
}

// 신청 모달
function openApplyModal(record = null) {
  document.getElementById("applyModalTitle").textContent = record ? "신청 정보 수정" : "참가 신청";
  document.getElementById("a-id").value = record ? record.id : "";
  document.getElementById("a-name").value = record ? record.applicant_name : "";
  document.getElementById("a-phone").value = record ? record.phone : "";
  document.getElementById("a-people").value = record ? record.people_count : 1;
  document.getElementById("a-message").value = record ? (record.message || "") : "";
  document.getElementById("applyModal").classList.add("open");
}
document.getElementById("btnApply").addEventListener("click", () => openApplyModal());
document.getElementById("btnCancelApply").addEventListener("click", () => document.getElementById("applyModal").classList.remove("open"));
document.getElementById("btnSubmitApply").addEventListener("click", async () => {
  const id = document.getElementById("a-id").value;
  const applicant_name = document.getElementById("a-name").value.trim();
  const phone = document.getElementById("a-phone").value.trim();
  const people_count = Number(document.getElementById("a-people").value) || 1;
  const message = document.getElementById("a-message").value.trim();
  if (!applicant_name || !phone) { toast("이름과 연락처를 입력해주세요."); return; }

  if (id) {
    const { error } = await supabase.from(APPLY_TABLE).update({ applicant_name, phone, people_count, message }).eq("id", id);
    if (error) { toast("수정 실패: " + error.message); return; }
    toast("신청 정보가 수정되었습니다.");
  } else {
    const { error } = await supabase.from(APPLY_TABLE).insert({ meetup_id: currentMeetup.id, applicant_name, phone, people_count, message });
    if (error) { toast("신청 실패: " + error.message); return; }
    toast("신청이 완료되었습니다!");
  }
  document.getElementById("applyModal").classList.remove("open");
  loadApplications(currentMeetup.id, currentMeetup.capacity);
});

// 모임 일정 폼
function openMeetupForm(record = null) {
  document.getElementById("mform-title").textContent = record ? "모임 일정 수정" : "모임 일정 추가";
  document.getElementById("mf-id").value = record ? record.id : "";
  document.getElementById("mf-title").value = record ? record.title : "";
  document.getElementById("mf-region").value = record ? record.region : "전국";
  document.getElementById("mf-date").value = record ? record.meetup_date : "";
  document.getElementById("mf-location").value = record ? (record.location || "") : "";
  document.getElementById("mf-capacity").value = record ? record.capacity : 60;
  document.getElementById("mf-desc").value = record ? (record.description || "") : "";
  showView("meetupForm");
}
document.getElementById("btnNewMeetup").addEventListener("click", () => openMeetupForm());
document.getElementById("btnEditMeetup").addEventListener("click", () => openMeetupForm(currentMeetup));
document.getElementById("btnCancelMeetup").addEventListener("click", () => showView(currentMeetup ? "detail" : "list"));
document.getElementById("btnSaveMeetup").addEventListener("click", async () => {
  const id = document.getElementById("mf-id").value;
  const payload = {
    title: document.getElementById("mf-title").value.trim(),
    region: document.getElementById("mf-region").value.trim() || "전국",
    meetup_date: document.getElementById("mf-date").value,
    location: document.getElementById("mf-location").value.trim(),
    capacity: Number(document.getElementById("mf-capacity").value) || 60,
    description: document.getElementById("mf-desc").value.trim(),
  };
  if (!payload.title || !payload.meetup_date) { toast("모임명과 날짜를 입력해주세요."); return; }

  if (id) {
    const { error } = await supabase.from(MEETUP_TABLE).update(payload).eq("id", id);
    if (error) { toast("수정 실패: " + error.message); return; }
    toast("일정이 수정되었습니다.");
    await openDetail(Number(id));
  } else {
    const { data, error } = await supabase.from(MEETUP_TABLE).insert(payload).select().single();
    if (error) { toast("등록 실패: " + error.message); return; }
    toast("일정이 등록되었습니다.");
    await openDetail(data.id);
  }
});

document.getElementById("btnDeleteMeetup").addEventListener("click", () => {
  deleteAction = { type: "meetup", id: currentMeetup.id };
  document.getElementById("deleteModalTitle").textContent = "모임 일정을 삭제할까요? (신청 내역도 함께 삭제됩니다)";
  document.getElementById("deleteModal").classList.add("open");
});

document.getElementById("btnCancelDelete").addEventListener("click", () => document.getElementById("deleteModal").classList.remove("open"));
document.getElementById("btnConfirmDelete").addEventListener("click", async () => {
  if (!deleteAction) return;
  if (deleteAction.type === "meetup") {
    const { error } = await supabase.from(MEETUP_TABLE).delete().eq("id", deleteAction.id);
    document.getElementById("deleteModal").classList.remove("open");
    if (error) { toast("삭제 실패: " + error.message); return; }
    toast("삭제되었습니다.");
    showView("list");
    loadList();
  } else {
    const { error } = await supabase.from(APPLY_TABLE).delete().eq("id", deleteAction.id);
    document.getElementById("deleteModal").classList.remove("open");
    if (error) { toast("삭제 실패: " + error.message); return; }
    toast("신청이 취소되었습니다.");
    loadApplications(currentMeetup.id, currentMeetup.capacity);
  }
});

document.getElementById("btnBack").addEventListener("click", () => { showView("list"); loadList(); });

showView("list");
loadList();
</script>
</body>
</html>
