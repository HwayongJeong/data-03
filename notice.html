<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공지사항 | 숲으로 캠핑클럽</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
@import url("https://fonts.googleapis.com/css2?family=Jua&display=swap");

:root{
  --sky: #6EC6E8;
  --sky-deep: #1F7DA3;
  --sky-pale: #E4F5FB;
  --leaf: #9AD46B;
  --leaf-deep: #4F8A34;
  --leaf-pale: #EEF9E4;
  --forest: #1E3626;
  --ink: #223026;
  --ink-soft: #58685C;
  --paper: #F6FBF4;
  --card: #FFFFFF;
  --line: #DCEBDD;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(30, 54, 38, 0.10);
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: "Pretendard", "Noto Sans KR", sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
}
h1,h2,h3, .brand, .btn-hero{
  font-family: "Jua", "Pretendard", sans-serif;
  font-weight: 400;
  letter-spacing: -0.01em;
}
a{ color: inherit; text-decoration: none; }
img{ max-width:100%; display:block; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family: inherit; cursor:pointer; }

.container{ max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* ---------- Header ---------- */
.site-header{
  position: sticky; top:0; z-index: 50;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.site-header .container{
  display:flex; align-items:center; justify-content:space-between;
  height: 68px;
}
.brand{ font-size: 22px; color: var(--forest); display:flex; align-items:center; gap:8px; }
.brand .tag{ font-family:"Pretendard"; font-size: 12px; color: var(--sky-deep); background: var(--sky-pale); padding: 3px 8px; border-radius: 999px; margin-left:4px; }
.nav{ display:flex; gap: 6px; }
.nav a{
  padding: 9px 14px; border-radius: 999px; font-size: 15px; color: var(--ink-soft);
  transition: background .15s, color .15s;
}
.nav a:hover{ background: var(--leaf-pale); color: var(--leaf-deep); }
.nav a.active{ background: var(--forest); color: #fff; }
.nav-toggle{ display:none; background:none; border:none; font-size:24px; color: var(--forest); }

@media (max-width: 760px){
  .nav{ position:fixed; top:68px; left:0; right:0; background:#fff; flex-direction:column; padding:10px 18px 18px; border-bottom:1px solid var(--line); display:none; }
  .nav.open{ display:flex; }
  .nav a{ padding:12px 10px; }
  .nav-toggle{ display:block; }
}

/* ---------- Hero ---------- */
.hero{
  position: relative;
  min-height: 66vh;
  display:flex; align-items:center;
  background:
    linear-gradient(180deg, rgba(15,35,24,.55), rgba(15,35,24,.72)),
    url("https://images.unsplash.com/photo-1476231682828-37e571bc172f?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  color: #fff;
  overflow: hidden;
}
.hero .container{ position: relative; z-index: 2; padding-top: 40px; padding-bottom: 70px; }
.hero-emojis{ font-size: 30px; letter-spacing: 12px; margin-bottom: 18px; opacity:.95; }
.hero h1{ font-size: clamp(32px, 5vw, 52px); margin: 0 0 14px; line-height:1.3; color:#fff; }
.hero p{ font-size: 17px; max-width: 520px; color: #EAF6EC; margin: 0 0 28px; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
.hero-stats{
  display:flex; gap: 30px; margin-top: 46px; flex-wrap:wrap;
}
.hero-stats div{ min-width: 120px; }
.hero-stats b{ display:block; font-size: 26px; font-family:"Jua"; color: var(--leaf); }
.hero-stats span{ font-size: 13px; color: #D9EBDC; }

.canopy{
  position:absolute; left:0; right:0; bottom:-1px; height: 46px; z-index:2;
  background: var(--paper);
  clip-path: polygon(0% 100%, 0% 40%, 3% 15%, 6% 45%, 9% 5%, 12% 40%, 15% 20%, 18% 48%, 22% 10%, 25% 42%, 28% 25%, 31% 46%, 35% 8%, 38% 40%, 41% 22%, 44% 48%, 48% 12%, 51% 44%, 54% 24%, 57% 46%, 61% 6%, 64% 40%, 67% 20%, 70% 48%, 74% 14%, 77% 44%, 80% 24%, 83% 46%, 87% 8%, 90% 40%, 93% 22%, 96% 48%, 100% 15%, 100% 100%);
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 11px 20px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--leaf); color: var(--forest); }
.btn-primary:hover{ box-shadow: 0 6px 16px rgba(79,138,52,.35); }
.btn-outline{ background: rgba(255,255,255,.12); color:#fff; border: 1px solid rgba(255,255,255,.6); }
.btn-outline:hover{ background: rgba(255,255,255,.22); }
.btn-sky{ background: var(--sky); color:#0B3A4A; }
.btn-sky:hover{ box-shadow: 0 6px 16px rgba(31,125,163,.30); }
.btn-ghost{ background: var(--leaf-pale); color: var(--leaf-deep); }
.btn-danger{ background: #FDEAEA; color: #B23A3A; }
.btn-sm{ padding: 7px 14px; font-size: 13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---------- Section ---------- */
.section{ padding: 64px 0; }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 30px; gap:16px; flex-wrap:wrap; }
.section-head h2{ font-size: 28px; color: var(--forest); margin: 0 0 6px; }
.section-head p{ color: var(--ink-soft); margin:0; font-size: 14px; }
.eyebrow{ color: var(--sky-deep); font-size: 13px; margin: 0 0 6px; }

.grid{ display:grid; gap: 20px; }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width: 860px){ .grid-3{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 620px){ .grid-3, .grid-2{ grid-template-columns: 1fr; } }

.card{
  background: var(--card); border-radius: var(--radius); padding: 22px;
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.card h3{ margin: 0 0 8px; font-size: 19px; color: var(--forest); }
.card .meta{ font-size: 13px; color: var(--sky-deep); margin-bottom: 10px; }
.badge{ display:inline-block; font-size:12px; background: var(--sky-pale); color: var(--sky-deep); padding: 3px 10px; border-radius:999px; margin-right:6px;}
.badge.leaf{ background: var(--leaf-pale); color: var(--leaf-deep); }

/* ---------- Page header (inner pages) ---------- */
.page-head{
  background: linear-gradient(120deg, var(--forest), #2A4B37);
  color:#fff; padding: 52px 0 40px;
}
.page-head h1{ margin:0 0 8px; font-size: 30px; }
.page-head p{ margin:0; color:#D9EBDC; font-size:14px; }

/* ---------- Board table / list ---------- */
.board-toolbar{ display:flex; justify-content:space-between; align-items:center; margin: 26px 0 14px; gap: 12px; flex-wrap:wrap; }
.search{ display:flex; gap:8px; }
.search input{ padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); min-width: 220px; }

.list{ border-top: 2px solid var(--forest); }
.list-row{
  display:flex; align-items:center; gap: 14px; padding: 16px 6px; border-bottom: 1px solid var(--line);
  cursor:pointer;
}
.list-row:hover{ background: var(--leaf-pale); }
.list-row .num{ width: 34px; color: var(--ink-soft); font-size:13px; text-align:center; }
.list-row .title{ flex:1; font-weight:600; }
.list-row .author{ width: 90px; color: var(--ink-soft); font-size: 13px; }
.list-row .date{ width: 100px; color: var(--ink-soft); font-size: 13px; text-align:right; }
.empty{ text-align:center; padding: 50px 10px; color: var(--ink-soft); }

/* ---------- Form ---------- */
.form-card{ background:var(--card); border:1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size: 13px; font-weight:600; color: var(--forest); margin-bottom: 6px; }
.field input, .field textarea, .field select{
  width:100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  font-family: inherit; font-size: 15px; background: #FBFEFA;
}
.field textarea{ min-height: 140px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus{ outline: 2px solid var(--leaf); border-color: transparent; }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width:620px){ .field-row{ grid-template-columns: 1fr; } }
.form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top: 20px; }

/* ---------- Detail view ---------- */
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.detail-head h2{ margin:0 0 8px; font-size:24px; color:var(--forest); }
.detail-body{ min-height: 120px; white-space: pre-wrap; margin-bottom: 26px; }
.detail-actions{ display:flex; gap:10px; }

/* ---------- Modal ---------- */
.modal-backdrop{
  position: fixed; inset:0; background: rgba(20,32,24,.45); display:none;
  align-items:center; justify-content:center; z-index: 100; padding: 20px;
}
.modal-backdrop.open{ display:flex; }
.modal{
  background:#fff; border-radius: var(--radius); padding: 26px; max-width: 480px; width:100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.modal h3{ margin:0 0 6px; color: var(--forest); }
.modal p.sub{ margin:0 0 18px; font-size:13px; color: var(--ink-soft); }

/* ---------- Meetup card ---------- */
.meetup-card{ background:var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:22px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:10px; }
.meetup-card .date-chip{ align-self:flex-start; background: var(--forest); color:#fff; font-size:12px; padding:4px 10px; border-radius:999px; }
.meetup-card .cap{ font-size:13px; color: var(--ink-soft); }
.progress{ height:6px; background: var(--leaf-pale); border-radius:999px; overflow:hidden; }
.progress > div{ height:100%; background: var(--leaf); }

.apply-list{ margin-top: 10px; }
.apply-row{ display:flex; justify-content:space-between; align-items:center; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.apply-row .who{ font-weight:600; }
.apply-row .sub{ color: var(--ink-soft); }

/* ---------- Gallery ---------- */
.gallery-item{ border-radius: var(--radius); overflow:hidden; background:var(--card); border:1px solid var(--line); box-shadow: var(--shadow); }
.gallery-item img{ height: 190px; width:100%; object-fit:cover; }
.gallery-item .pad{ padding: 14px 16px; }

/* ---------- Footer ---------- */
.site-footer{ background: var(--forest); color: #CFE6D3; padding: 44px 0 30px; margin-top: 60px; }
.site-footer .container{ display:flex; justify-content:space-between; flex-wrap:wrap; gap: 20px; }
.site-footer .brand{ color:#fff; }
.site-footer small{ display:block; margin-top:6px; color:#9FC2A6; }
.foot-links{ display:flex; gap:16px; }
.foot-links a:hover{ color: var(--leaf); }

.toast{
  position: fixed; bottom: 26px; left:50%; transform: translateX(-50%);
  background: var(--forest); color:#fff; padding: 12px 22px; border-radius: 999px;
  font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.25); z-index: 200;
  opacity:0; pointer-events:none; transition: opacity .2s, transform .2s;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }

.loading{ text-align:center; padding: 40px; color: var(--ink-soft); }

</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">🌲 숲으로 <span class="tag">Camping Club</span></a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="notice.html" class="active">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </nav>
    <button class="nav-toggle" aria-label="메뉴">☰</button>
  </div>
</header>

<div class="page-head">
  <div class="container">
    <h1>📌 공지사항</h1>
    <p>숲으로 캠핑클럽의 새로운 소식을 확인하세요.</p>
  </div>
</div>

<div class="container">

  <!-- 목록 화면 -->
  <section id="view-list">
    <div class="board-toolbar">
      <div class="search">
        <input id="searchInput" type="text" placeholder="제목으로 검색" />
        <button class="btn btn-sky btn-sm" id="btnSearch">검색</button>
      </div>
      <button class="btn btn-primary" id="btnNew">✏️ 글쓰기</button>
    </div>
    <div id="list" class="list">
      <div class="loading">불러오는 중...</div>
    </div>
  </section>

  <!-- 상세 화면 -->
  <section id="view-detail" style="display:none;">
    <div class="detail-head">
      <div>
        <span class="badge">공지</span>
        <h2 id="d-title"></h2>
        <p class="meta" id="d-meta" style="color:var(--ink-soft); font-size:13px;"></p>
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost btn-sm" id="btnEdit">수정</button>
        <button class="btn btn-danger btn-sm" id="btnDelete">삭제</button>
      </div>
    </div>
    <div class="detail-body" id="d-content"></div>
    <button class="btn btn-ghost" id="btnBackFromDetail">← 목록으로</button>
  </section>

  <!-- 작성/수정 화면 -->
  <section id="view-form" style="display:none;" class="section" style="padding-top:0;">
    <div class="form-card">
      <h3 id="form-title">공지 작성</h3>
      <input type="hidden" id="f-id" />
      <div class="field">
        <label>제목</label>
        <input type="text" id="f-title" placeholder="제목을 입력하세요" />
      </div>
      <div class="field">
        <label>작성자</label>
        <input type="text" id="f-author" placeholder="운영진" />
      </div>
      <div class="field">
        <label>내용</label>
        <textarea id="f-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="btnCancel">취소</button>
        <button class="btn btn-primary" id="btnSave">저장</button>
      </div>
    </div>
  </section>

</div>

<!-- 삭제 확인 모달 -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3>공지사항을 삭제할까요?</h3>
    <p class="sub">삭제한 글은 되돌릴 수 없습니다.</p>
    <div class="form-actions">
      <button class="btn btn-ghost" id="btnCancelDelete">취소</button>
      <button class="btn btn-danger" id="btnConfirmDelete">삭제</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="brand">🌲 숲으로 캠핑클럽</div>
      <small>연 4회 정기모임 · 매달 지역별 소모임 · 함께 떠나는 캠핑</small>
    </div>
    <div class="foot-links">
      <a href="notice.html">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </div>
  </div>
</footer>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://njiwzlmdtiyensuvqsqa.supabase.co";
const SUPABASE_KEY = "sb_publishable_sz88_3yW6ETu_00gL-MjdA_9UcO-DYf";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// 테이블 접두어: camp_
const TABLES = {
  notices: "camp_notices",
  posts: "camp_posts",
  regularMeetups: "camp_regular_meetups",
  regularApplications: "camp_regular_applications",
  smallMeetups: "camp_small_meetups",
  smallApplications: "camp_small_applications",
  gallery: "camp_gallery",
};

function formatDate(iso) {
  const d = new Date(iso);
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}.${mm}.${dd}`;
}

function formatDateFull(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

let toastTimer;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function initNavToggle() {
  const btn = document.querySelector(".nav-toggle");
  const nav = document.querySelector(".nav");
  if (btn && nav) {
    btn.addEventListener("click", () => nav.classList.toggle("open"));
  }
}

initNavToggle();

const TABLE = TABLES.notices;
let currentList = [];
let deleteTargetId = null;

const views = {
  list: document.getElementById("view-list"),
  detail: document.getElementById("view-detail"),
  form: document.getElementById("view-form"),
};
function showView(name) {
  Object.entries(views).forEach(([k, el]) => el.style.display = (k === name ? "" : "none"));
}

async function loadList(keyword = "") {
  views.list.querySelector("#list").innerHTML = `<div class="loading">불러오는 중...</div>`;
  let query = supabase.from(TABLE).select("*").order("created_at", { ascending: false });
  if (keyword) query = query.ilike("title", `%${keyword}%`);
  const { data, error } = await query;
  const el = document.getElementById("list");
  if (error) { el.innerHTML = `<div class="empty">목록을 불러오지 못했습니다: ${escapeHtml(error.message)}</div>`; return; }
  currentList = data;
  if (!data.length) { el.innerHTML = `<div class="empty">등록된 글이 없습니다. 첫 글을 작성해보세요!</div>`; return; }
  el.innerHTML = data.map((n, i) => `
    <div class="list-row" data-id="${n.id}">
      <span class="num">${data.length - i}</span>
      <span class="title">${escapeHtml(n.title)}</span>
      <span class="author">${escapeHtml(n.author)}</span>
      <span class="date">${formatDateFull(n.created_at)}</span>
    </div>
  `).join("");
  el.querySelectorAll(".list-row").forEach(row => {
    row.addEventListener("click", () => openDetail(Number(row.dataset.id)));
  });
}

async function openDetail(id) {
  const { data, error } = await supabase.from(TABLE).select("*").eq("id", id).single();
  if (error || !data) { toast("글을 찾을 수 없습니다."); return; }
  document.getElementById("d-title").textContent = data.title;
  document.getElementById("d-meta").textContent = `${data.author} · ${formatDateFull(data.created_at)}`;
  document.getElementById("d-content").textContent = data.content;
  views.detail.dataset.id = data.id;
  history.replaceState(null, "", `?id=${data.id}`);
  showView("detail");
  supabase.from(TABLE).update({ view_count: (data.view_count || 0) + 1 }).eq("id", id).then(() => {});
}

function openForm(record = null) {
  document.getElementById("form-title").textContent = record ? "공지 수정" : "공지 작성";
  document.getElementById("f-id").value = record ? record.id : "";
  document.getElementById("f-title").value = record ? record.title : "";
  document.getElementById("f-author").value = record ? record.author : "";
  document.getElementById("f-content").value = record ? record.content : "";
  showView("form");
}

document.getElementById("btnNew").addEventListener("click", () => openForm());
document.getElementById("btnBackFromDetail").addEventListener("click", () => { history.replaceState(null, "", location.pathname); showView("list"); loadList(); });
document.getElementById("btnCancel").addEventListener("click", () => showView(views.detail.dataset.id ? "detail" : "list"));

document.getElementById("btnEdit").addEventListener("click", async () => {
  const id = Number(views.detail.dataset.id);
  const { data } = await supabase.from(TABLE).select("*").eq("id", id).single();
  openForm(data);
});

document.getElementById("btnDelete").addEventListener("click", () => {
  deleteTargetId = Number(views.detail.dataset.id);
  document.getElementById("deleteModal").classList.add("open");
});
document.getElementById("btnCancelDelete").addEventListener("click", () => document.getElementById("deleteModal").classList.remove("open"));
document.getElementById("btnConfirmDelete").addEventListener("click", async () => {
  const { error } = await supabase.from(TABLE).delete().eq("id", deleteTargetId);
  document.getElementById("deleteModal").classList.remove("open");
  if (error) { toast("삭제 실패: " + error.message); return; }
  toast("삭제되었습니다.");
  history.replaceState(null, "", location.pathname);
  showView("list");
  loadList();
});

document.getElementById("btnSave").addEventListener("click", async () => {
  const id = document.getElementById("f-id").value;
  const title = document.getElementById("f-title").value.trim();
  const author = document.getElementById("f-author").value.trim() || "운영진";
  const content = document.getElementById("f-content").value.trim();
  if (!title || !content) { toast("제목과 내용을 입력해주세요."); return; }

  if (id) {
    const { error } = await supabase.from(TABLE).update({ title, author, content, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) { toast("수정 실패: " + error.message); return; }
    toast("수정되었습니다.");
    await openDetail(Number(id));
  } else {
    const { data, error } = await supabase.from(TABLE).insert({ title, author, content }).select().single();
    if (error) { toast("등록 실패: " + error.message); return; }
    toast("등록되었습니다.");
    await openDetail(data.id);
  }
});

document.getElementById("btnSearch").addEventListener("click", () => loadList(document.getElementById("searchInput").value.trim()));
document.getElementById("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") loadList(e.target.value.trim()); });

// 초기 진입: URL의 id 파라미터 확인
const params = new URLSearchParams(location.search);
if (params.get("id")) {
  openDetail(Number(params.get("id")));
} else {
  showView("list");
}
loadList();
</script>
</body>
</html>
