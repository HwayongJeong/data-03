<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공지사항 | 숲으로 캠핑클럽</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">🌲 숲으로 <span class="tag">Camping Club</span></a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="notice.html" class="active">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </nav>
    <button class="nav-toggle" aria-label="메뉴">☰</button>
  </div>
</header>

<div class="page-head">
  <div class="container">
    <h1>📌 공지사항</h1>
    <p>숲으로 캠핑클럽의 새로운 소식을 확인하세요.</p>
  </div>
</div>

<div class="container">

  <!-- 목록 화면 -->
  <section id="view-list">
    <div class="board-toolbar">
      <div class="search">
        <input id="searchInput" type="text" placeholder="제목으로 검색" />
        <button class="btn btn-sky btn-sm" id="btnSearch">검색</button>
      </div>
      <button class="btn btn-primary" id="btnNew">✏️ 글쓰기</button>
    </div>
    <div id="list" class="list">
      <div class="loading">불러오는 중...</div>
    </div>
  </section>

  <!-- 상세 화면 -->
  <section id="view-detail" style="display:none;">
    <div class="detail-head">
      <div>
        <span class="badge">공지</span>
        <h2 id="d-title"></h2>
        <p class="meta" id="d-meta" style="color:var(--ink-soft); font-size:13px;"></p>
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost btn-sm" id="btnEdit">수정</button>
        <button class="btn btn-danger btn-sm" id="btnDelete">삭제</button>
      </div>
    </div>
    <div class="detail-body" id="d-content"></div>
    <button class="btn btn-ghost" id="btnBackFromDetail">← 목록으로</button>
  </section>

  <!-- 작성/수정 화면 -->
  <section id="view-form" style="display:none;" class="section" style="padding-top:0;">
    <div class="form-card">
      <h3 id="form-title">공지 작성</h3>
      <input type="hidden" id="f-id" />
      <div class="field">
        <label>제목</label>
        <input type="text" id="f-title" placeholder="제목을 입력하세요" />
      </div>
      <div class="field">
        <label>작성자</label>
        <input type="text" id="f-author" placeholder="운영진" />
      </div>
      <div class="field">
        <label>내용</label>
        <textarea id="f-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="btnCancel">취소</button>
        <button class="btn btn-primary" id="btnSave">저장</button>
      </div>
    </div>
  </section>

</div>

<!-- 삭제 확인 모달 -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3>공지사항을 삭제할까요?</h3>
    <p class="sub">삭제한 글은 되돌릴 수 없습니다.</p>
    <div class="form-actions">
      <button class="btn btn-ghost" id="btnCancelDelete">취소</button>
      <button class="btn btn-danger" id="btnConfirmDelete">삭제</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="brand">🌲 숲으로 캠핑클럽</div>
      <small>연 4회 정기모임 · 매달 지역별 소모임 · 함께 떠나는 캠핑</small>
    </div>
    <div class="foot-links">
      <a href="notice.html">공지사항</a>
      <a href="board.html">자유게시판</a>
      <a href="regular.html">정기모임</a>
      <a href="small.html">소모임</a>
      <a href="gallery.html">갤러리</a>
    </div>
  </div>
</footer>

<script type="module">
import { supabase, TABLES, formatDateFull, escapeHtml, toast, initNavToggle } from "./js/supabase-client.js";
initNavToggle();

const TABLE = TABLES.notices;
let currentList = [];
let deleteTargetId = null;

const views = {
  list: document.getElementById("view-list"),
  detail: document.getElementById("view-detail"),
  form: document.getElementById("view-form"),
};
function showView(name) {
  Object.entries(views).forEach(([k, el]) => el.style.display = (k === name ? "" : "none"));
}

async function loadList(keyword = "") {
  views.list.querySelector("#list").innerHTML = `<div class="loading">불러오는 중...</div>`;
  let query = supabase.from(TABLE).select("*").order("created_at", { ascending: false });
  if (keyword) query = query.ilike("title", `%${keyword}%`);
  const { data, error } = await query;
  const el = document.getElementById("list");
  if (error) { el.innerHTML = `<div class="empty">목록을 불러오지 못했습니다: ${escapeHtml(error.message)}</div>`; return; }
  currentList = data;
  if (!data.length) { el.innerHTML = `<div class="empty">등록된 글이 없습니다. 첫 글을 작성해보세요!</div>`; return; }
  el.innerHTML = data.map((n, i) => `
    <div class="list-row" data-id="${n.id}">
      <span class="num">${data.length - i}</span>
      <span class="title">${escapeHtml(n.title)}</span>
      <span class="author">${escapeHtml(n.author)}</span>
      <span class="date">${formatDateFull(n.created_at)}</span>
    </div>
  `).join("");
  el.querySelectorAll(".list-row").forEach(row => {
    row.addEventListener("click", () => openDetail(Number(row.dataset.id)));
  });
}

async function openDetail(id) {
  const { data, error } = await supabase.from(TABLE).select("*").eq("id", id).single();
  if (error || !data) { toast("글을 찾을 수 없습니다."); return; }
  document.getElementById("d-title").textContent = data.title;
  document.getElementById("d-meta").textContent = `${data.author} · ${formatDateFull(data.created_at)}`;
  document.getElementById("d-content").textContent = data.content;
  views.detail.dataset.id = data.id;
  history.replaceState(null, "", `?id=${data.id}`);
  showView("detail");
  supabase.from(TABLE).update({ view_count: (data.view_count || 0) + 1 }).eq("id", id).then(() => {});
}

function openForm(record = null) {
  document.getElementById("form-title").textContent = record ? "공지 수정" : "공지 작성";
  document.getElementById("f-id").value = record ? record.id : "";
  document.getElementById("f-title").value = record ? record.title : "";
  document.getElementById("f-author").value = record ? record.author : "";
  document.getElementById("f-content").value = record ? record.content : "";
  showView("form");
}

document.getElementById("btnNew").addEventListener("click", () => openForm());
document.getElementById("btnBackFromDetail").addEventListener("click", () => { history.replaceState(null, "", location.pathname); showView("list"); loadList(); });
document.getElementById("btnCancel").addEventListener("click", () => showView(views.detail.dataset.id ? "detail" : "list"));

document.getElementById("btnEdit").addEventListener("click", async () => {
  const id = Number(views.detail.dataset.id);
  const { data } = await supabase.from(TABLE).select("*").eq("id", id).single();
  openForm(data);
});

document.getElementById("btnDelete").addEventListener("click", () => {
  deleteTargetId = Number(views.detail.dataset.id);
  document.getElementById("deleteModal").classList.add("open");
});
document.getElementById("btnCancelDelete").addEventListener("click", () => document.getElementById("deleteModal").classList.remove("open"));
document.getElementById("btnConfirmDelete").addEventListener("click", async () => {
  const { error } = await supabase.from(TABLE).delete().eq("id", deleteTargetId);
  document.getElementById("deleteModal").classList.remove("open");
  if (error) { toast("삭제 실패: " + error.message); return; }
  toast("삭제되었습니다.");
  history.replaceState(null, "", location.pathname);
  showView("list");
  loadList();
});

document.getElementById("btnSave").addEventListener("click", async () => {
  const id = document.getElementById("f-id").value;
  const title = document.getElementById("f-title").value.trim();
  const author = document.getElementById("f-author").value.trim() || "운영진";
  const content = document.getElementById("f-content").value.trim();
  if (!title || !content) { toast("제목과 내용을 입력해주세요."); return; }

  if (id) {
    const { error } = await supabase.from(TABLE).update({ title, author, content, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) { toast("수정 실패: " + error.message); return; }
    toast("수정되었습니다.");
    await openDetail(Number(id));
  } else {
    const { data, error } = await supabase.from(TABLE).insert({ title, author, content }).select().single();
    if (error) { toast("등록 실패: " + error.message); return; }
    toast("등록되었습니다.");
    await openDetail(data.id);
  }
});

document.getElementById("btnSearch").addEventListener("click", () => loadList(document.getElementById("searchInput").value.trim()));
document.getElementById("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") loadList(e.target.value.trim()); });

// 초기 진입: URL의 id 파라미터 확인
const params = new URLSearchParams(location.search);
if (params.get("id")) {
  openDetail(Number(params.get("id")));
} else {
  showView("list");
}
loadList();
</script>
</body>
</html>
